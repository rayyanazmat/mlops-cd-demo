name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Derive release metadata
        id: metadata
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a semantic-version tag such as v1.2.3, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          owner="${GITHUB_REPOSITORY%%/*}"
          echo "image=ghcr.io/$(printf '%s' "$owner" | tr '[:upper:]' '[:lower:]')/student-ml-api" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.metadata.outputs.image }}:${{ steps.metadata.outputs.version }}
            ${{ steps.metadata.outputs.image }}:latest
            ${{ steps.metadata.outputs.image }}:${{ steps.metadata.outputs.revision }}
          build-args: |
            APP_VERSION=${{ steps.metadata.outputs.version }}
            VCS_REF=${{ github.sha }}
            SOURCE=https://github.com/${{ github.repository }}
            BUILD_DATE=${{ steps.metadata.outputs.build_date }}

      - name: Report published image digest
        run: |
          echo "Published ${{ steps.metadata.outputs.image }}:${{ steps.metadata.outputs.version }}"
          echo "Digest: ${{ steps.build.outputs.digest }}"
